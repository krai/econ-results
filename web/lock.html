<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>@@TITLE@@</title>
<script>
try { var t = localStorage.getItem("econ-results-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --border: rgba(255, 255, 255, .16);
        --navy1: #021528; --navy2: #04203a; --brand1: #0d83cc; --brand2: #2ef9fb; --brandink: #9fb2c3; --warn: #f2b38c; }
:root[data-theme="light"] { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e;
                            --border: rgba(11, 11, 11, .22); --warn: #9a3412; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.brand { display: flex; align-items: center; gap: 22px; padding: 14px 16px; background: linear-gradient(180deg, var(--navy1), var(--navy2));
         color: #fff; position: relative; }
.brand::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--brand1), var(--brand2)); }
.logo { display: inline-flex; align-items: center; gap: 6px; padding-right: 20px; border-right: 1px solid #3a4f63; }
.wordmark { height: 22px; width: auto; }
.mark { height: 44px; width: auto; }
.brand h1 { font-size: 20px; line-height: 1.25; font-weight: 600; margin: 0; letter-spacing: -0.2px; }
.brand p { margin: 2px 0 0; color: var(--brandink); font-size: 13px; }
main { max-width: 460px; margin: 12vh auto 0; padding: 0 16px 48px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px 22px 18px; }
.card h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; margin: 0 0 6px; }
.card p { margin: 0 0 14px; color: var(--ink2); }
label { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
.row { display: flex; gap: 8px; }
input { flex: 1 1 auto; min-width: 0; min-height: 44px; font: inherit; color: var(--ink); background: var(--page);
        border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
button { font: inherit; font-weight: 600; color: #04203a; background: linear-gradient(90deg, var(--brand1), var(--brand2)); border: 0;
         border-radius: 6px; min-height: 44px; padding: 8px 16px; cursor: pointer; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--brand2); outline-offset: 2px; }
#status { min-height: 20px; margin: 12px 0 0; color: var(--warn); }
</style>
</head>
<body>
<header class="brand">
<a class="logo" href="https://krai.ai" rel="noopener" aria-label="KRAI">
<svg class="wordmark" viewBox="0 0 573.94 150.42" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M407.6.59,342.26,146.25H362c30.35-68.75,17.72-40.72,55.76-127.34,41.12,93.64,22.53,52.7,56,127.34h19.56L428,.59ZM269.14,146.25H292L244,92.35c41-.38,54.56-51.67,28.82-78C255.91-7.9,194.66,3,170.3.59V146.25h18.1V93.81h35.37ZM235.63,77.59H188.4V16.82c16.37,2,60.07-6.32,71.16,9.37,18,19.8,4.88,53.67-23.93,51.4M0,150.42H17.89V82l71,68.46h22.47v-1.26L37.94,77.59,111.32,6V4.76H88.85l-71,68.45V4.76H0Zm555.84-4.17h18.1V.59h-18.1Z"/></svg>
<svg class="mark" viewBox="0 0 178.82 300.47" aria-hidden="true"><defs><clipPath id="aclip"><polygon points="0 178.83 44.7 178.83 71.11 185.82 89.42 178.83 178.82 0 0 178.83"/></clipPath><linearGradient id="agrad" x1="-866.71" y1="727.99" x2="-865.71" y2="727.99" gradientTransform="matrix(199.64, 0, 0, -199.64, 173047.94, 145431.05)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0d83cc"/><stop offset="1" stop-color="#2ef9fb"/></linearGradient><clipPath id="aclip-2"><polygon points="44.7 178.83 166.36 300.47 105.54 178.83 44.7 178.83"/></clipPath><linearGradient id="agrad-2" x1="-862.21" y1="726.07" x2="-861.21" y2="726.07" gradientTransform="matrix(-105.31, 0, 0, 105.31, -90690.83, -76218.91)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0d83cc"/><stop offset="1" stop-color="#2ef9fb"/></linearGradient><clipPath id="aclip-3"><rect x="44.59" y="179.15" width="44.71" height="29.81"/></clipPath></defs><g clip-path="url(#aclip)"><rect fill="url(#agrad)" x="-33.73" y="-28.68" width="246.29" height="243.18" transform="translate(-33.73 131.15) rotate(-63.35)"/></g><g clip-path="url(#aclip-2)"><rect fill="url(#agrad-2)" x="44.7" y="178.83" width="121.66" height="121.65"/></g><g opacity="0.7"><g clip-path="url(#aclip-3)"><polygon fill="#0d151c" points="44.59 179.15 74.4 208.96 89.3 179.15 44.59 179.15"/></g></g></svg>
</a>
<div>
<h1>econ results</h1>
<p>For KRAI's internal use</p>
</div>
</header>
<main id="lock" hidden>
<div class="card">
<h2><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2M3.5 7h9v6.5h-9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>This page opens with its link</h2>
<p>The link KRAI gave you carries the key. The address alone does not open it.</p>
<form id="form">
<label for="key">Paste the link, or its key</label>
<div class="row"><input id="key" type="password" autocomplete="off" spellcheck="false" required><button type="submit">Open</button></div>
</form>
<p id="status" role="status" aria-live="polite"></p>
</div>
</main>
<noscript><p style="max-width: 460px; margin: 12vh auto 0; padding: 0 16px">This page needs JavaScript to open.</p></noscript>
<script type="application/octet-stream" id="sealed" data-format="econ-lock/1" data-iv="@@IV@@">@@SEALED@@</script>
<script>
@@SCRIPT@@
</script>
</body>
</html>
