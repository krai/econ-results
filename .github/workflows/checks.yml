# What every pull request and every push to main must pass: the files copied from econ are unedited; the tests pass
# (node runs the page's own arithmetic against econ's numbers, and the page's lock with the WebCrypto a browser has);
# every record is valid, the original files it cites are here, every run folder has its record and nothing holds a
# secret; and the page builds. The built page is kept as an artifact, so a pull request that adds a run can be looked
# at before it is merged. It is the internal page in the clear: only who can read this repository can download it.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The files copied from econ are unedited
        run: python -m tools.vendor
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Every record is valid, its original files are here and nothing holds a secret
        run: python -m tools.validate runs --sources sources
      - name: The page builds
        run: python -m tools.build runs --out site --audience internal
      - name: Nothing built is committed
        run: test -z "$(git ls-files site locked)"
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: site/index.html
          retention-days: 30
