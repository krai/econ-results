# The dashboard: on every push to main the registry is validated and the page is built. Then it is published.
#
# Always: as the file of this repository's release "dashboard" (econ-results.html), which
#     https://github.com/OWNER/REPO/releases/latest/download/econ-results.html
# downloads: one file that works offline.
#
# When GitHub Pages is on for this repository (Settings > Pages > Source: GitHub Actions): as the web page
#     https://OWNER.github.io/REPO/
# GitHub serves Pages for a public repository, or for a private one on a paid plan. A Pages site has no sign-in:
# whoever has its address can open it, whatever the repository's visibility.
#
# When the repository variable SITE_REPOSITORY (OWNER/NAME) is set: as a locked web page, for a registry that is to
# stay internal. The page goes, encrypted, to that second repository, which holds nothing else and serves it with
# Pages; it shows nothing of the registry without its key. The key is the secret SITE_KEY, and it travels in the link
# people are given. SITE_DEPLOY_KEY is a deploy key of that repository: it can write there and nowhere else.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # the release's file
  pages: write     # the deployment to Pages
  id-token: write  # which Pages asks of what deploys to it

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The files copied from econ are unedited
        run: python -m tools.vendor
      - name: Every record is valid, its original files are here and nothing holds a secret
        run: python -m tools.validate runs --sources sources
      - name: Build the page
        run: python -m tools.build runs --out site --audience internal
      - name: Keep the page as the file of the release "dashboard"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp site/index.html econ-results.html
          notes="The dashboard as one file that works offline: download econ-results.html and open it. Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d) at $(date -u +%H:%M) UTC."
          if gh release view dashboard >/dev/null 2>&1; then
            gh release upload dashboard econ-results.html --clobber
            gh release edit dashboard --notes "$notes"
          else
            gh release create dashboard econ-results.html --title "Dashboard" --notes "$notes"
          fi
      - id: pages
        name: Is GitHub Pages on for this repository?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then on=true; else on=false; fi
          echo "on=$on" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages on: $on"
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.pages.outputs.on == 'true' }}
        with:
          path: site
      - name: Lock it with the site's key
        if: ${{ vars.SITE_REPOSITORY != '' }}
        env:
          ECON_SITE_KEY: ${{ secrets.SITE_KEY }}
        run: python -m tools.lock site/index.html --out locked/index.html
      - name: The locked page opens with its key, and names no run without it
        if: ${{ vars.SITE_REPOSITORY != '' }}
        env:
          ECON_SITE_KEY: ${{ secrets.SITE_KEY }}
        run: |
          python -m tools.lock locked/index.html --open --out opened.html
          cmp site/index.html opened.html
          for id in $(ls runs | sed 's/\.json$//'); do
            if grep -q -F "$id" locked/index.html; then echo "the locked page names a run"; exit 1; fi
          done
      - uses: actions/checkout@v4
        if: ${{ vars.SITE_REPOSITORY != '' }}
        with:
          repository: ${{ vars.SITE_REPOSITORY }}
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: published
      - name: Publish the locked page
        if: ${{ vars.SITE_REPOSITORY != '' }}
        run: |
          cp locked/index.html published/index.html
          touch published/.nojekyll
          cd published
          git add index.html .nojekyll
          if git diff --cached --quiet; then echo "the site already has this page"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "site: the locked page of $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "published $(git rev-parse --short HEAD)"

  pages:
    needs: site
    if: ${{ needs.site.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
